<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B · Balances, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A99CFF}a:hover{color:#C7BEFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0D0B1A; color: #F1EFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; gap: 8px; padding: 12px 8px 4px 20px">
    <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: 0; background: none; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; color: #F1EFFF">
      Goa trip
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F1EFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div style="flex: 1"></div>
    <button type="button" aria-label="Group settings" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: #1A1630; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F1EFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
    </button>
  </header>

  <main style="display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 0">
    <div role="tablist" style="display: flex; gap: 8px">
      <button type="button" role="tab" aria-selected="false" style="min-height: 44px; padding: 0 20px; border: 0; border-radius: 22px; background: #1A1630; font: inherit; font-size: 15px; font-weight: 600; color: #C9C3E6">Expenses</button>
      <button type="button" role="tab" aria-selected="true" style="min-height: 44px; padding: 0 20px; border: 0; border-radius: 22px; background: #F1EFFF; font: inherit; font-size: 15px; font-weight: 700; color: #0D0B1A">Balances</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{mine}}" as="p" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 22px; background: #1A1630; grid-column: {{p.span}}">
          <span style="display: flex; align-items: center; gap: 10px">
            <span style="width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #0D0B1A; background: {{p.color}}">{{p.initial}}</span>
            <span style="font-size: 15px; font-weight: 700">{{p.name}}</span>
          </span>
          <span style="font-size: 13px; font-weight: 600; color: {{p.tone}}">{{p.text}}</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: {{p.tone}}">{{p.amount}}</span>
        </div>
      </sc-for>
    </div>

    <button type="button" role="switch" aria-checked="true" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; border: 0; border-radius: 20px; background: #2A2257; font: inherit; color: inherit; text-align: left">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700">Simplify debts</span>
        <span style="font-size: 13px; color: #C9C3E6">6 → 3 payments settle everyone</span>
      </span>
      <span aria-hidden="true" style="width: 46px; height: 28px; border-radius: 14px; background: #7C6BFF; position: relative; display: block">
        <span style="position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; display: block"></span>
      </span>
    </button>

    <section style="display: flex; flex-direction: column; gap: 4px">
      <h3 style="margin: 0; font-size: 13px; font-weight: 700; color: #A8A2C8">Fewest payments</h3>
      <ol style="list-style: none; margin: 0; padding: 0">
        <sc-for list="{{payments}}" as="o" hint-placeholder-count="3">
          <li style="display: flex; align-items: center; gap: 10px; min-height: 56px">
            <span style="width: 32px; height: 32px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #0D0B1A; background: {{o.fromColor}}">{{o.fromInitial}}</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A8A2C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            <span style="width: 32px; height: 32px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #0D0B1A; background: {{o.toColor}}">{{o.toInitial}}</span>
            <span style="flex: 1; font-size: 15px; color: {{o.tone}}">{{o.text}}</span>
            <span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{o.tone}}">{{o.amount}}</span>
          </li>
        </sc-for>
      </ol>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { Asha: '#A99CFF', Rahul: '#FF9F6B', Neha: '#4ADE9F', Bilal: '#E879F9' };
    const gets = '#A99CFF', owes = '#FF9F6B', plain = '#F1EFFF';
    return {
      mine: [
        { initial: 'R', name: 'Rahul', color: C.Rahul, text: 'owes you', amount: '₹965', tone: gets, span: 'auto' },
        { initial: 'N', name: 'Neha', color: C.Neha, text: 'owes you', amount: '₹815', tone: gets, span: 'auto' },
        { initial: 'B', name: 'Bilal', color: C.Bilal, text: 'you owe', amount: '₹885', tone: owes, span: '1 / -1' }
      ],
      payments: [
        { fromInitial: 'R', fromColor: C.Rahul, toInitial: 'B', toColor: C.Bilal, text: 'Rahul pays Bilal', amount: '₹3,115', tone: plain },
        { fromInitial: 'N', fromColor: C.Neha, toInitial: 'B', toColor: C.Bilal, text: 'Neha pays Bilal', amount: '₹1,470', tone: plain },
        { fromInitial: 'N', fromColor: C.Neha, toInitial: 'A', toColor: C.Asha, text: 'Neha pays you', amount: '₹895', tone: gets }
      ]
    };
  }
}
</script>
</body>
</html>
