<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Group screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E7C6B}a:hover{color:#0A5C50}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F4F6F5; color: #12201C; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 16px">
    <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: 0; background: none; font: inherit; color: inherit; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">
      Goa trip
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6B66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div style="flex: 1"></div>
    <div aria-label="4 members" role="img" style="display: flex">
      <sc-for list="{{members}}" as="m" hint-placeholder-count="4">
        <span style="width: 30px; height: 30px; border-radius: 50%; border: 2px solid #F4F6F5; margin-left: -8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #FFFFFF; background: {{m.color}}">{{m.initial}}</span>
      </sc-for>
    </div>
    <button type="button" aria-label="Group settings" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; border-radius: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12201C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
    </button>
  </header>

  <main style="display: flex; flex-direction: column; gap: 16px; padding: 4px 16px 0">
    <section aria-label="Your balance" style="background: #0E7C6B; color: #FFFFFF; border-radius: 24px; padding: 20px 20px 8px; display: flex; flex-direction: column; gap: 4px">
      <p style="margin: 0; font-size: 14px; font-weight: 600; color: #D4EFE8">You get back</p>
      <p style="margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">₹895</p>
      <ul style="list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column">
        <sc-for list="{{people}}" as="p" hint-placeholder-count="3">
          <li style="display: flex; align-items: center; gap: 10px; min-height: 44px; border-top: 1px solid rgba(255,255,255,0.18)">
            <span style="width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #FFFFFF; color: {{p.color}}">{{p.initial}}</span>
            <span style="flex: 1; font-size: 15px; font-weight: 500">{{p.text}}</span>
            <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{p.amount}}</span>
          </li>
        </sc-for>
      </ul>
    </section>

    <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E4EAE8; border-radius: 16px">
      <button type="button" role="tab" aria-selected="true" style="min-height: 44px; border: 0; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; color: #12201C; box-shadow: 0 1px 2px rgba(18,32,28,0.08)">Expenses</button>
      <button type="button" role="tab" aria-selected="false" style="min-height: 44px; border: 0; border-radius: 12px; background: none; font: inherit; font-size: 15px; font-weight: 600; color: #4A5A55">Balances</button>
    </div>

    <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h3 style="margin: 0; padding-left: 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5B6B66">{{d.label}}</h3>
        <ul style="list-style: none; margin: 0; padding: 0 14px; background: #FFFFFF; border-radius: 20px">
          <sc-for list="{{d.rows}}" as="r" hint-placeholder-count="2">
            <li style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-top: {{r.border}}">
              <span style="width: 38px; height: 38px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #FFFFFF; background: {{r.color}}">{{r.initial}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
                <span style="font-size: 13px; color: #5B6B66">{{r.sub}}</span>
              </span>
              <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
                <span style="font-size: 12px; font-weight: 600; color: {{r.tone}}">{{r.effect}}</span>
                <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{r.tone}}">{{r.amount}}</span>
              </span>
            </li>
          </sc-for>
        </ul>
      </section>
    </sc-for>
  </main>

  <button type="button" style="position: absolute; right: 16px; bottom: 24px; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 22px 0 18px; border: 0; border-radius: 28px; background: #0E7C6B; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; box-shadow: 0 8px 24px rgba(14,124,107,0.35)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Add expense
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { Asha: '#0E7C6B', Rahul: '#3657C9', Neha: '#B4470F', Bilal: '#7A4BC2' };
    const gets = '#0E7C6B', owes = '#B4470F', muted = '#5B6B66';
    const row = (payer, title, sub, effect, amount, tone, first) => ({
      initial: payer[0], color: C[payer], title, sub, effect, amount, tone, border: first ? '0' : '1px solid #EDF1EF'
    });
    return {
      members: ['Asha', 'Rahul', 'Neha', 'Bilal'].map((n) => ({ initial: n[0], color: C[n] })),
      people: [
        { initial: 'R', color: C.Rahul, text: 'Rahul owes you', amount: '₹965' },
        { initial: 'N', color: C.Neha, text: 'Neha owes you', amount: '₹815' },
        { initial: 'B', color: C.Bilal, text: 'You owe Bilal', amount: '₹885' }
      ],
      days: [
        { label: 'Today', rows: [
          row('Asha', 'Dinner at Thalassa', 'You paid ₹3,600', 'you lent', '₹2,700', gets, true),
          row('Rahul', 'Cab to Baga beach', 'Rahul paid ₹450', 'you owe', '₹150', owes, false)
        ] },
        { label: 'Yesterday', rows: [
          row('Neha', 'Scooter rental', 'Neha paid ₹1,200', 'you owe', '₹300', owes, true),
          row('Asha', 'Groceries', 'You paid ₹860', 'you lent', '₹645', gets, false)
        ] },
        { label: 'Fri, 20 Nov', rows: [
          row('Bilal', 'Villa deposit', 'Bilal paid ₹8,000', 'you owe', '₹2,000', owes, true)
        ] }
      ],
      muted
    };
  }
}
</script>
</body>
</html>
