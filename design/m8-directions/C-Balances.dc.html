<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C · Balances, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8DB2FF}a:hover{color:#B7CEFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0B0B; color: #F2F2F2; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; gap: 8px; padding: 12px 10px 8px 16px; border-bottom: 1.5px solid #F2F2F2">
    <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: 0; background: none; font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 700; letter-spacing: 0.08em; color: #F2F2F2">
      GOA TRIP
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F2F2" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div style="flex: 1"></div>
    <button type="button" aria-label="Group settings" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F2F2" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
    </button>
  </header>

  <main style="display: flex; flex-direction: column; gap: 18px; padding: 8px 16px 0">
    <div role="tablist" style="display: flex; gap: 20px; border-bottom: 1.5px solid #2E2E2E">
      <button type="button" role="tab" aria-selected="false" style="min-height: 44px; padding: 0; border: 0; background: none; font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.06em; color: #A3A3A3">EXPENSES</button>
      <button type="button" role="tab" aria-selected="true" style="min-height: 44px; padding: 0; border: 0; border-bottom: 3px solid #F2F2F2; margin-bottom: -1.5px; background: none; font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; color: #F2F2F2">BALANCES</button>
    </div>

    <section style="border: 1.5px dashed #5A5A5A; border-radius: 6px; padding: 14px 16px 8px">
      <h3 style="margin: 0 0 4px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A3A3A3">YOU AND EACH PERSON</h3>
      <ul style="list-style: none; margin: 0; padding: 0">
        <sc-for list="{{mine}}" as="p" hint-placeholder-count="3">
          <li style="display: flex; align-items: baseline; gap: 6px; min-height: 48px; padding-top: 16px; box-sizing: border-box">
            <span style="font-size: 17px; font-weight: 600">{{p.name}}</span>
            <span style="font-size: 14px; color: {{p.tone}}">{{p.text}}</span>
            <span aria-hidden="true" style="flex: 1; border-bottom: 2px dotted #4A4A4A; transform: translateY(-4px)"></span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 700; color: {{p.tone}}">{{p.amount}}</span>
          </li>
        </sc-for>
      </ul>
      <p style="margin: 10px 0 0; padding-top: 10px; border-top: 1.5px solid #2E2E2E; display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700">
        <span>NET</span><span style="color: #8DB2FF">+₹895</span>
      </p>
    </section>

    <button type="button" role="switch" aria-checked="false" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 4px; border: 0; border-bottom: 1.5px solid #2E2E2E; background: none; font: inherit; color: inherit; text-align: left">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600">Simplify debts</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A3A3A3">6 → 3 PAYMENTS</span>
      </span>
      <span aria-hidden="true" style="width: 46px; height: 26px; box-sizing: border-box; border: 1.5px solid #F2F2F2; border-radius: 4px; position: relative; display: block">
        <span style="position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 2px; background: #F2F2F2; display: block"></span>
      </span>
    </button>

    <section>
      <h3 style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A3A3A3">BETWEEN OTHERS</h3>
      <ul style="list-style: none; margin: 0; padding: 0">
        <sc-for list="{{others}}" as="o" hint-placeholder-count="3">
          <li style="display: flex; align-items: baseline; gap: 6px; min-height: 44px; padding-top: 14px; box-sizing: border-box; font-size: 15px">
            <span>{{o.text}}</span>
            <span aria-hidden="true" style="flex: 1; border-bottom: 2px dotted #3A3A3A; transform: translateY(-4px)"></span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600">{{o.amount}}</span>
          </li>
        </sc-for>
      </ul>
    </section>
  </main>

  <button type="button" style="position: absolute; right: 16px; bottom: 24px; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 20px; border: 0; border-radius: 8px; background: #F2F2F2; color: #0B0B0B; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.06em">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B0B0B" stroke-width="2.6" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    ADD EXPENSE
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const gets = '#8DB2FF', owes = '#FF9A5C';
    return {
      mine: [
        { name: 'Rahul', text: 'owes you', amount: '₹965', tone: gets },
        { name: 'Neha', text: 'owes you', amount: '₹815', tone: gets },
        { name: 'Bilal', text: 'you owe', amount: '₹885', tone: owes }
      ],
      others: [
        { text: 'Rahul owes Bilal', amount: '₹2,000' },
        { text: 'Neha owes Bilal', amount: '₹1,700' },
        { text: 'Rahul owes Neha', amount: '₹150' }
      ]
    };
  }
}
</script>
</body>
</html>
