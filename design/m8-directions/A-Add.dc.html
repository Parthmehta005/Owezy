<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Add expense</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E7C6B}a:hover{color:#0A5C50}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #3A4543; color: #12201C; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <div role="dialog" aria-label="Add expense" style="position: absolute; left: 0; right: 0; top: 16px; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 20px; padding: 8px 16px 0">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D5DDDA; display: block"></span>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" style="min-height: 44px; padding: 0 8px; border: 0; background: none; font: inherit; font-size: 16px; font-weight: 600; color: #4A5A55">Cancel</button>
      <h2 style="margin: 0; font-size: 17px; font-weight: 800">Add expense</h2>
      <button type="button" style="min-height: 44px; padding: 0 20px; border: 0; border-radius: 22px; background: #0E7C6B; font: inherit; font-size: 16px; font-weight: 700; color: #FFFFFF">Save</button>
    </div>

    <label style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0 4px">
      <span style="font-size: 13px; font-weight: 600; color: #5B6B66">Amount</span>
      <span style="display: flex; align-items: baseline; gap: 4px">
        <span style="font-size: 32px; font-weight: 700; color: #5B6B66">₹</span>
        <input value="1,240" inputmode="decimal" aria-label="Amount in rupees" style="width: 180px; border: 0; background: none; font: inherit; font-size: 56px; font-weight: 800; letter-spacing: -0.03em; color: #12201C; text-align: center; outline: none">
      </span>
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #5B6B66">What was it for?</span>
      <input value="Breakfast at Infantaria" style="min-height: 52px; padding: 0 16px; border: 1.5px solid #DDE5E2; border-radius: 16px; background: #F7F9F8; font: inherit; font-size: 16px; color: #12201C">
    </label>

    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 6px; border: 1.5px solid #DDE5E2; border-radius: 22px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #12201C">
        <span style="width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #FFFFFF; background: #0E7C6B">A</span>
        Paid by you
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1.5px solid #DDE5E2; border-radius: 22px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #12201C">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E7C6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Equally, all 4
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1.5px solid #DDE5E2; border-radius: 22px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #12201C">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E7C6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Today
      </button>
    </div>

    <ul style="list-style: none; margin: 0; padding: 14px 8px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; background: #F4F6F5; border-radius: 20px">
      <sc-for list="{{split}}" as="s" hint-placeholder-count="4">
        <li style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #FFFFFF; background: {{s.color}}">{{s.initial}}</span>
          <span style="font-size: 13px; font-weight: 600">{{s.name}}</span>
          <span style="font-size: 13px; color: #5B6B66; font-variant-numeric: tabular-nums">₹310</span>
        </li>
      </sc-for>
    </ul>

    <p style="margin: 0; align-self: center; padding: 10px 16px; border-radius: 14px; background: #E2F4EF; font-size: 15px; font-weight: 600; color: #0A5C50">You get back ₹930</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { Asha: '#0E7C6B', Rahul: '#3657C9', Neha: '#B4470F', Bilal: '#7A4BC2' };
    return {
      split: [['Asha', 'You'], ['Rahul', 'Rahul'], ['Neha', 'Neha'], ['Bilal', 'Bilal']].map(([n, label]) => ({ initial: n[0], name: label, color: C[n] }))
    };
  }
}
</script>
</body>
</html>
